name: Verify and publish CalcWeave Pages

# Publication is an explicit action on the default branch. Untrusted PRs cannot
# obtain the Pages OIDC/deployment permissions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calcweave-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run verify:coverage
      - run: npm run build
      - run: npm run verify:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
        with:
          enablement: false
      - name: Require the configured root custom domain
        env:
          CALCWEAVE_PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          CALCWEAVE_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          node --input-type=module - <<'NODE'
          if (process.env.CALCWEAVE_PAGES_BASE !== '' || process.env.CALCWEAVE_PAGES_ORIGIN !== 'https://calcweave.com') {
            throw new Error('Configure and verify calcweave.com in Pages settings before publishing this root-only app.');
          }
          NODE
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
